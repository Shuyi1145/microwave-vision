name: Web quality
on:
  push:
    branches: [main, 'workbuddy/**', 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check WorkBuddy file ownership
        env:
          TASK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$TASK_BRANCH" in
            workbuddy/portal-ui) node scripts/check-boundaries.mjs portal ;;
            workbuddy/lesson-ui) node scripts/check-boundaries.mjs lesson-ui ;;
            workbuddy/practice) node scripts/check-boundaries.mjs practice ;;
          esac
